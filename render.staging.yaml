# Isolated Render staging service. Do NOT apply this as a replacement for
# render.yaml (production mining-os-api). Attach a staging Postgres URL only.

services:
  - type: web
    name: mining-os-api-staging
    runtime: python
    plan: starter
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python -m playwright install chromium && cd frontend && npm ci && npm run build"
    startCommand: "python -m mining_os.pipelines.run_all --init-db && uvicorn mining_os.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MINING_OS_ENVIRONMENT
        value: "staging"
      - key: ENABLE_ACTIVE_MINES_API
        value: "true"
      - key: ENABLE_ACTIVE_MINES_JOBS
        value: "true"
      - key: VITE_ENABLE_ACTIVE_MINES
        value: "true"
      - key: VITE_MINING_OS_ENV
        value: "staging"
      - key: MINING_OS_MLRS_PAYMENT_HEADLESS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
