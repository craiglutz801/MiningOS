# Isolated staging compose — separate containers and database from local/dev.
# Usage:
#   docker compose -f docker-compose.staging.yml --env-file config/staging.env.example up -d
# Never point DATABASE_URL at miningos.onrender.com.

name: miningos-staging

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mining_os_staging_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miningos_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miningos_staging}
      POSTGRES_DB: ${POSTGRES_DB:-miningos_staging}
    ports:
      - "${STAGING_POSTGRES_PORT:-55432}:5432"
    volumes:
      - staging_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miningos_staging} -d ${POSTGRES_DB:-miningos_staging}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  staging_db_data:
